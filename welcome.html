<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Welcome to CertificateHub</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #080b12,
      #111827,
      #0b1220
    );

  color: white;

  min-height: 100vh;

  overflow-x: hidden;
}


/* =========================================
   MAIN WELCOME PAGE
========================================= */

.welcome-page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 25px 16px;
}


.welcome-container {

  width: 100%;

  max-width: 1050px;

  text-align: center;
}


/* =========================================
   BRAND
========================================= */

.brand {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  margin-bottom: 25px;
}


.brand-icon {

  width: 45px;

  height: 45px;

  border-radius: 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #c9a24e;

  color: #111827;

  font-size: 23px;

  font-weight: 900;

  box-shadow:
    0 8px 25px rgba(201,162,78,.25);
}


.brand-name {

  font-size: 23px;

  font-weight: 800;

  letter-spacing: .3px;
}


/* =========================================
   WELCOME TEXT
========================================= */

.welcome-badge {

  display: inline-block;

  padding: 8px 15px;

  border-radius: 30px;

  background:
    rgba(201,162,78,.12);

  border:
    1px solid rgba(201,162,78,.35);

  color: #d8b766;

  font-size: 11px;

  font-weight: 800;

  letter-spacing: 1px;

  margin-bottom: 18px;
}


.welcome-container h1 {

  font-size: 42px;

  line-height: 1.15;

  margin-bottom: 15px;
}


.welcome-container h1 span {

  color: #c9a24e;
}


.welcome-description {

  max-width: 650px;

  margin: 0 auto 30px;

  color: #aeb6c4;

  font-size: 16px;

  line-height: 1.7;
}


/* =========================================
   PROGRESS
========================================= */

.progress-area {

  max-width: 420px;

  margin: 0 auto 28px;
}


.progress-bar {

  width: 100%;

  height: 5px;

  background: rgba(255,255,255,.10);

  border-radius: 20px;

  overflow: hidden;
}


.progress-fill {

  width: 25%;

  height: 100%;

  background: #c9a24e;

  border-radius: 20px;

  transition: width .3s ease;
}


.progress-text {

  margin-top: 8px;

  color: #788292;

  font-size: 11px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

  .welcome-page {

    padding:
      25px 15px;
  }


  .welcome-container h1 {

    font-size: 30px;
  }


  .welcome-description {

    font-size: 14px;

    line-height: 1.65;
  }


  .brand-name {

    font-size: 20px;
  }

}

</style>

</head>


<body>


<div class="welcome-page">

  <div class="welcome-container">


    <!-- BRAND -->

    <div class="brand">

      <div class="brand-icon">
        ✦
      </div>

      <div class="brand-name">
        CertificateHub
      </div>

    </div>


    <!-- BADGE -->

    <div class="welcome-badge">

      WELCOME TO CERTIFICATEHUB

    </div>


    <!-- TITLE -->

    <h1>

      Create.
      <span>Verify.</span>
      Protect.

    </h1>


    <!-- DESCRIPTION -->

    <p class="welcome-description">

      Your professional certificate platform.
      Create beautiful certificates, verify
      credentials instantly, and keep your
      certificate records organized in one secure
      place.

    </p>


    <!-- PROGRESS -->

    <div class="progress-area">

      <div class="progress-bar">

        <div
          class="progress-fill"
          id="progressFill"
        ></div>

      </div>


      <div
        class="progress-text"
        id="progressText"
      >

        Step 1 of 4

      </div>

    </div>


  </div>

</div>

</body>

</html>
