<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CertificateHub - Customer Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    /* HEADER */
    header {
      background: #111827;
      color: white;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.35);
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    /* MAIN */
    .container {
      width: 92%;
      max-width: 1100px;
      margin: 30px auto 50px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 7px;
      color: #111827;
    }

    .welcome p {
      color: #6b7280;
      font-size: 15px;
      word-break: break-word;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
      border: 1px solid #e5e7eb;
    }

    .stat-label {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 9px;
    }

    .stat-number {
      font-size: 30px;
      font-weight: 800;
      color: #111827;
    }

    .verified {
      color: #15803d;
      font-size: 18px;
      font-weight: 700;
    }

    /* QUICK ACTIONS */
    .section-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #111827;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 35px;
    }

    .action-btn {
      border: none;
      border-radius: 13px;
      padding: 19px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      background: white;
      color: #111827;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .action-btn:hover {
      transform: translateY(-1px);
    }

    .action-sub {
      display: block;
      font-size: 13px;
      font-weight: 400;
      color: #6b7280;
      margin-top: 5px;
    }

    /* CERTIFICATES */
    .certificates-box {
      background: white;
      border-radius: 15px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.05);
    }

    .certificates-header {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
    }

    .certificate-list {
      padding: 0;
    }

    .certificate-card {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .certificate-card:last-child {
      border-bottom: none;
    }

    .certificate-info h3 {
      font-size: 17px;
      margin-bottom: 7px;
      color: #111827;
    }

    .certificate-info p {
      font-size: 13px;
      color: #6b7280;
      margin: 4px 0;
    }

    .certificate-number {
      color: #111827 !important;
      font-weight: 700;
    }

    .view-btn {
      background: #111827;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      white-space: nowrap;
    }

    .view-btn:hover {
      background: #374151;
    }

    /* EMPTY STATE */
    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #6b7280;
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .empty h3 {
      color: #111827;
      margin-bottom: 8px;
    }

    .generate-btn {
      margin-top: 18px;
      background: #111827;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    /* LOADING */
    .loading {
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }

    /* ERROR */
    .error-box {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    /* MOBILE */
    @media (max-width: 700px) {

      .container {
        width: 94%;
        margin-top: 22px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .certificate-card {
        flex-direction: column;
        align-items: flex-start;
      }

      .view-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">CertificateHub</div>

    <button class="logout-btn" id="logoutBtn">
      Log Out
    </button>
  </header>


  <main class="container">

    <!-- ERROR -->
    <div id="errorBox" class="error-box"></div>


    <!-- WELCOME -->
    <section class="welcome">
      <h1>Welcome back 👋</h1>
      <p id="userEmail">Loading your account...</p>
    </section>


    <!-- STATS -->
    <section class="stats">

      <div class="stat-card">
        <div class="stat-label">
          Total Certificates
        </div>

        <div class="stat-number" id="totalCertificates">
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          Certificates This Year
        </div>

        <div class="stat-number" id="yearCertificates">
          0
        </div>
      </div>


      <div class="stat-card">
        <div class="stat-label">
          Verification System
        </div>

        <div class="verified">
          ✓ Active
        </div>
      </div>

    </section>


    <!-- QUICK ACTIONS -->
    <section>

      <h2 class="section-title">
        Quick Actions
      </h2>

      <div class="actions">

        <button
          class="action-btn"
          onclick="goToGenerator()"
        >
          Generate Certificate

          <span class="action-sub">
            Create a new certificate
          </span>
        </button>


        <button
          class="action-btn"
          onclick="goToVerification()"
        >
          Verify Certificate

          <span class="action-sub">
            Check certificate authenticity
          </span>
        </button>

      </div>

    </section>


    <!-- CERTIFICATES -->
    <section>

      <div class="certificates-box">

        <div class="certificates-header">
          <h2 class="section-title" style="margin-bottom:0;">
            Your Certificates
          </h2>
        </div>


        <div id="certificateList">

          <div class="loading">
            Loading your certificates...
          </div>

        </div>

      </div>

    </section>

  </main>


  <script>

    /* =========================================
       SUPABASE CONFIGURATION
    ========================================= */

    const SUPABASE_URL =
      "https://gdophhworvapqctpmyia.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_PUMkwRHzr6lwQQzTQyO1bQ_DCmmQ9ww";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =========================================
       ELEMENTS
    ========================================= */

    const userEmail =
      document.getElementById("userEmail");

    const totalCertificates =
      document.getElementById("totalCertificates");

    const yearCertificates =
      document.getElementById("yearCertificates");

    const certificateList =
      document.getElementById("certificateList");

    const errorBox =
      document.getElementById("errorBox");

    const logoutBtn =
      document.getElementById("logoutBtn");


    /* =========================================
       ERROR MESSAGE
    ========================================= */

    function showError(message) {

      errorBox.textContent = message;

      errorBox.style.display = "block";

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================
       LOAD DASHBOARD
    ========================================= */

    async function loadDashboard() {

      try {

        /*
          Get the currently logged-in Supabase user.
        */

        const {
          data: {
            user
          },
          error: userError
        } = await supabaseClient.auth.getUser();


        if (userError) {
          throw userError;
        }


        /*
          If there is no logged-in user,
          send them back to the main page.
        */

        if (!user) {

          userEmail.textContent =
            "You are not logged in.";

          certificateList.innerHTML = `
            <div class="empty">

              <div class="empty-icon">
                🔐
              </div>

              <h3>
                Please log in
              </h3>

              <p>
                You need to log in to view your certificates.
              </p>

              <button
                class="generate-btn"
                onclick="goToGenerator()"
              >
                Go to Login
              </button>

            </div>
          `;

          return;
        }


        /*
          Display customer's email.
        */

        userEmail.textContent =
          user.email || "Customer";


        /*
          Get certificates belonging
          ONLY to this customer.
        */

        const {
          data: certificates,
          error: certificateError
        } = await supabaseClient
          .from("certificates")
          .select(`
            student_name,
            course_name,
            completion_date,
            cert_number,
            institution,
            director
          `)
          .eq("user_id", user.id)
          .order("completion_date", {
            ascending: false
          });


        if (certificateError) {
          throw certificateError;
        }


        const list =
          certificates || [];


        /* =====================================
           TOTAL CERTIFICATES
        ===================================== */

        totalCertificates.textContent =
          list.length;


        /* =====================================
           CURRENT YEAR
        ===================================== */

        const currentYear =
          new Date().getFullYear();


        const thisYear =
          list.filter(cert => {

            if (!cert.completion_date) {
              return false;
            }

            return new Date(
              cert.completion_date
            ).getFullYear() === currentYear;

          });


        yearCertificates.textContent =
          thisYear.length;


        /* =====================================
           EMPTY STATE
        ===================================== */

        if (list.length === 0) {

          certificateList.innerHTML = `
            <div class="empty">

              <div class="empty-icon">
                📜
              </div>

              <h3>
                No certificates yet
              </h3>

              <p>
                Certificates you generate will appear here.
              </p>

              <button
                class="generate-btn"
                onclick="goToGenerator()"
              >
                Generate Certificate
              </button>

            </div>
          `;

          return;
        }


        /* =====================================
           DISPLAY CERTIFICATES
        ===================================== */

        certificateList.innerHTML =
          list.map(cert => {

            const name =
              escapeHTML(cert.student_name);

            const course =
              escapeHTML(cert.course_name);

            const institution =
              escapeHTML(cert.institution);

            const number =
              escapeHTML(cert.cert_number);

            let date = "Date not available";


            if (cert.completion_date) {

              const d =
                new Date(cert.completion_date);

              if (!isNaN(d.getTime())) {

                date =
                  d.toLocaleDateString(
                    "en-US",
                    {
                      year: "numeric",
                      month: "long",
                      day: "numeric"
                    }
                  );

              }

            }


            return `

              <div class="certificate-card">

                <div class="certificate-info">

                  <h3>
                    ${name}
                  </h3>

                  <p>
                    <strong>Course:</strong>
                    ${course || "Not specified"}
                  </p>

                  <p>
                    <strong>Institution:</strong>
                    ${institution || "Not specified"}
                  </p>

                  <p class="certificate-number">
                    Certificate No:
                    ${number || "Not available"}
                  </p>

                  <p>
                    Completion Date:
                    ${date}
                  </p>

                </div>


                <button
                  class="view-btn"
                  onclick="viewCertificate('${encodeURIComponent(cert.cert_number || "")}')"
                >
                  Verify
                </button>

              </div>

            `;

          }).join("");

      }

      catch (error) {

        console.error(
          "Dashboard error:",
          error
        );

        showError(
          "Unable to load your certificates. " +
          (error.message || "")
        );

        certificateList.innerHTML = `
          <div class="empty">

            <div class="empty-icon">
              ⚠️
            </div>

            <h3>
              Something went wrong
            </h3>

            <p>
              Please refresh the page and try again.
            </p>

          </div>
        `;

      }

    }


    /* =========================================
       VIEW / VERIFY CERTIFICATE
    ========================================= */

    function viewCertificate(certNumber) {

      if (!certNumber) {
        return;
      }

      window.location.href =
        "verify.html?cert=" +
        certNumber;

    }


    /* =========================================
       GENERATOR
    ========================================= */

    function goToGenerator() {

      window.location.href =
        "index.html";

    }


    /* =========================================
       VERIFICATION
    ========================================= */

    function goToVerification() {

      window.location.href =
        "verify.html";

    }


    /* =========================================
       LOG OUT
    ========================================= */

    logoutBtn.addEventListener(
      "click",
      async function () {

        logoutBtn.disabled = true;

        logoutBtn.textContent =
          "Logging out...";


        const {
          error
        } = await supabaseClient.auth.signOut();


        if (error) {

          console.error(error);

          logoutBtn.disabled = false;

          logoutBtn.textContent =
            "Log Out";

          showError(
            "Unable to log out. Please try again."
          );

          return;
        }


        window.location.href =
          "index.html";

      }
    );


    /* =========================================
       START DASHBOARD
    ========================================= */

    loadDashboard();

  </script>

</body>
</html>
