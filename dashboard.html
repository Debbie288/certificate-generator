<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Certificate Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0 0 5px;
            font-size: 22px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
            font-size: 14px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 11px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        #logoutButton {
            background: #dc2626;
            color: white;
        }

        #logoutButton:hover {
            background: #b91c1c;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        #searchInput {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #f3f4f6;
            text-align: left;
            padding: 12px;
            font-size: 13px;
        }

        td {
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .status {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        .delete-button {
            background: #fee2e2;
            color: #b91c1c;
        }

        .delete-button:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 19px;
            }

            .card {
                padding: 12px;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>🎓 Certificate Generator</h1>
    <p>Admin Dashboard</p>
</header>


<div class="container">

    <div class="top-bar">

        <h2>📋 Certificates</h2>

        <button id="logoutButton">
            🚪 Logout
        </button>

    </div>


    <div class="card">

        <input
            type="text"
            id="searchInput"
            placeholder="🔎 Search by student, course, certificate number..."
        >


        <div id="status" class="status">
            ⏳ Loading certificates...
        </div>


        <table id="certificateTable" style="display:none;">

            <thead>
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Institution</th>
                    <th>Date</th>
                    <th>Certificate ID</th>
                    <th>Director</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="certificateBody"></tbody>

        </table>

    </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const supabaseUrl =
    'https://gdophhworvapqctpmyia.supabase.co';

const supabaseKey =
    'sb_publishable_PUMkwRHzr6lwQQzTQyO1bQ_DCmmQ9ww';


const supabaseClient =
    window.supabase.createClient(
        supabaseUrl,
        supabaseKey
    );


let certificates = [];


const status =
    document.getElementById('status');

const table =
    document.getElementById('certificateTable');

const body =
    document.getElementById('certificateBody');

const searchInput =
    document.getElementById('searchInput');

const logoutButton =
    document.getElementById('logoutButton');



/* ==========================================
   CHECK LOGIN
========================================== */

async function checkLogin() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            'admin.html';

        return false;
    }


    return true;
}



/* ==========================================
   LOAD CERTIFICATES
========================================== */

async function loadCertificates() {

    status.style.display =
        'block';

    status.textContent =
        '⏳ Loading certificates...';


    const {
        data,
        error
    } =
        await supabaseClient
            .from('certificates')
            .select('*')
            .order('id', {
                ascending: false
            });


    if (error) {

        console.error(error);

        status.textContent =
            '❌ Could not load certificates: ' +
            error.message;

        return;
    }


    certificates =
        data || [];


    displayCertificates(
        certificates
    );
}



/* ==========================================
   DISPLAY CERTIFICATES
========================================== */

function displayCertificates(list) {

    body.innerHTML = '';


    if (!list.length) {

        table.style.display =
            'none';

        status.style.display =
            'block';

        status.textContent =
            'No certificates found.';

        return;
    }


    status.style.display =
        'none';

    table.style.display =
        'table';


    list.forEach(function(cert) {

        const row =
            document.createElement('tr');


        row.innerHTML = `

            <td>
                ${escapeHTML(
                    cert.student_name || ''
                )}
            </td>

            <td>
                ${escapeHTML(
                    cert.course_name || ''
                )}
            </td>

            <td>
                ${escapeHTML(
                    cert.institution || ''
                )}
            </td>

            <td>
                ${escapeHTML(
                    cert.completion_date || ''
                )}
            </td>

            <td>
                <strong>
                    ${escapeHTML(
                        cert.cert_number || ''
                    )}
                </strong>
            </td>

            <td>
                ${escapeHTML(
                    cert.director || ''
                )}
            </td>

            <td>

                <button
                    class="delete-button"
                    onclick="deleteCertificate(${cert.id})"
                >
                    🗑️ Delete
                </button>

            </td>

        `;


        body.appendChild(row);

    });

}



/* ==========================================
   SEARCH
========================================== */

searchInput.addEventListener(
    'input',
    function() {

        const search =
            this.value
                .toLowerCase()
                .trim();


        if (!search) {

            displayCertificates(
                certificates
            );

            return;
        }


        const filtered =
            certificates.filter(
                function(cert) {

                    return (

                        (cert.student_name || '')
                            .toLowerCase()
                            .includes(search)

                        ||

                        (cert.course_name || '')
                            .toLowerCase()
                            .includes(search)

                        ||

                        (cert.cert_number || '')
                            .toLowerCase()
                            .includes(search)

                        ||

                        (cert.institution || '')
                            .toLowerCase()
                            .includes(search)

                    );

                }
            );


        displayCertificates(
            filtered
        );

    }
);



/* ==========================================
   DELETE CERTIFICATE
========================================== */

async function deleteCertificate(id) {

    const confirmed =
        confirm(
            'Are you sure you want to delete this certificate?'
        );


    if (!confirmed) return;


    const {
        error
    } =
        await supabaseClient
            .from('certificates')
            .delete()
            .eq('id', id);


    if (error) {

        alert(
            '❌ Could not delete certificate:\n\n' +
            error.message
        );

        return;
    }


    alert(
        '✅ Certificate deleted.'
    );


    loadCertificates();
}



/* ==========================================
   LOGOUT
========================================== */

logoutButton.addEventListener(
    'click',
    async function() {

        await supabaseClient.auth.signOut();

        window.location.href =
            'admin.html';

    }
);



/* ==========================================
   SECURITY
========================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, '&amp;')

        .replace(/</g, '&lt;')

        .replace(/>/g, '&gt;')

        .replace(/"/g, '&quot;')

        .replace(/'/g, '&#039;');

}



/* ==========================================
   START
========================================== */

(async function() {

    const loggedIn =
        await checkLogin();


    if (loggedIn) {

        loadCertificates();

    }

})();

</script>

</body>
      </html>
