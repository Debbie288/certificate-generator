<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertificateHub — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ink: #101B2D;
      --ink-2: #16233A;
      --parchment: #F6F1E4;
      --parchment-2: #EFE7D3;
      --gold: #C6A15B;
      --gold-soft: #8A7239;
      --maroon: #7A2331;
      --slate: #8B93A3;
      --slate-soft: #5C6478;
      --white: #FDFBF6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--ink);
      color: var(--white);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(16, 27, 45, 0.96);
      border-bottom: 1px solid rgba(198, 161, 91, 0.18);
      backdrop-filter: blur(14px);
    }

    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-family: "Fraunces", serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .nav-links a {
      color: var(--slate);
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--white);
    }

    .main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 52px 24px 70px;
    }

    .page-heading {
      margin-bottom: 32px;
    }

    .page-heading h1 {
      font-family: "Fraunces", serif;
      font-size: clamp(32px, 5vw, 46px);
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    .page-heading p {
      color: var(--slate);
      font-size: 15px;
      max-width: 650px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 34px;
    }

    .stat-card {
      background: var(--ink-2);
      border: 1px solid rgba(198, 161, 91, 0.15);
      border-radius: 14px;
      padding: 22px;
    }

    .stat-label {
      color: var(--slate);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .stat-value {
      font-family: "Fraunces", serif;
      font-size: 30px;
      color: var(--white);
    }

    .section {
      margin-top: 38px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .section-heading h2 {
      font-family: "Fraunces", serif;
      font-size: 24px;
      font-weight: 500;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .action-card {
      display: block;
      background: var(--ink-2);
      border: 1px solid rgba(198, 161, 91, 0.15);
      border-radius: 14px;
      padding: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .action-card:hover {
      transform: translateY(-2px);
      border-color: rgba(198, 161, 91, 0.42);
    }

    .action-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(198, 161, 91, 0.1);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      font-size: 18px;
    }

    .action-card h3 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .action-card p {
      color: var(--slate);
      font-size: 13px;
      line-height: 1.5;
    }
        .preview-section {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.8fr);
      gap: 24px;
      align-items: stretch;
    }

    .certificate-stage {
      background: var(--ink-2);
      border: 1px solid rgba(198, 161, 91, 0.15);
      border-radius: 16px;
      padding: 24px;
      overflow: hidden;
    }

    .certificate {
      background: var(--parchment);
      color: var(--ink);
      min-height: 330px;
      border: 2px solid var(--gold);
      padding: 24px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }

    .certificate::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid var(--gold-soft);
      pointer-events: none;
    }

    .certificate-label {
      font-family: "Fraunces", serif;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--gold-soft);
      margin-bottom: 8px;
    }

    .certificate-status {
      position: absolute;
      top: 20px;
      right: 22px;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--maroon);
      font-weight: 600;
    }

    .certificate h3 {
      font-family: "Fraunces", serif;
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .certificate-recipient {
      font-family: "Fraunces", serif;
      font-size: 20px;
      color: var(--maroon);
      margin-bottom: 10px;
    }

    .certificate-description {
      max-width: 480px;
      color: var(--slate-soft);
      font-size: 12px;
      line-height: 1.6;
    }

    .certificate-bottom {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 28px;
      padding: 0 18px;
      position: relative;
      z-index: 2;
    }

    .signature {
      text-align: left;
    }

    .signature-line {
      width: 100px;
      border-top: 1px solid var(--ink);
      margin-bottom: 4px;
    }

    .signature span {
      font-size: 8px;
      color: var(--slate-soft);
    }

    .seal {
      width: 58px;
      height: 58px;
      border: 2px solid var(--maroon);
      border-radius: 50%;
      color: var(--maroon);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Fraunces", serif;
      font-size: 13px;
    }

    .certificate-number {
      text-align: right;
      font-size: 8px;
      color: var(--slate-soft);
    }

    .preview-info {
      background: var(--ink-2);
      border: 1px solid rgba(198, 161, 91, 0.15);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .preview-info h2 {
      font-family: "Fraunces", serif;
      font-size: 28px;
      font-weight: 500;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .preview-info > p {
      color: var(--slate);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .feature-list {
      list-style: none;
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .feature-list li {
      color: var(--slate);
      font-size: 13px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .feature-list li::before {
      content: "✓";
      color: var(--gold);
      font-weight: 600;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 9px;
      background: var(--gold);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .primary-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .certificates-list {
      display: grid;
      gap: 12px;
    }

    .certificate-row {
      background: var(--ink-2);
      border: 1px solid rgba(198, 161, 91, 0.15);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .certificate-row-main {
      min-width: 0;
    }

    .certificate-row h3 {
      font-family: "Fraunces", serif;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .certificate-row p {
      color: var(--slate);
      font-size: 12px;
    }

    .view-btn {
      border: 1px solid rgba(198, 161, 91, 0.4);
      color: var(--gold);
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .empty-state {
      background: var(--ink-2);
      border: 1px dashed rgba(198, 161, 91, 0.25);
      border-radius: 14px;
      padding: 34px 20px;
      text-align: center;
    }

    .empty-state h3 {
      font-family: "Fraunces", serif;
      font-size: 21px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .empty-state p {
      color: var(--slate);
      font-size: 13px;
      margin-bottom: 18px;
    }
