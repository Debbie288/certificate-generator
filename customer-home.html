<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Welcome to CertificateHub</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --ink:#101B2D;
  --ink-2:#16233A;
  --parchment:#F6F1E4;
  --parchment-2:#EFE7D3;
  --gold:#C6A15B;
  --gold-soft:#8A7239;
  --maroon:#7A2331;
  --slate:#8B93A3;
  --slate-soft:#5C6478;
  --white:#FDFBF6;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  height:100%;
}

body{
  background:var(--ink);
  color:var(--white);
  font-family:'Inter', sans-serif;
  overflow:hidden;
}

.app{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
}

.screen{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:32px 24px 100px;

  opacity:0;
  visibility:hidden;
  transform:translateY(10px);

  transition:
    opacity .5s ease,
    transform .5s ease,
    visibility 0s linear .5s;

  text-align:center;
}

.screen.active{
  opacity:1;
  visibility:visible;
  transform:translateY(0);

  transition:
    opacity .5s ease,
    transform .5s ease;
}

.brand{
  font-family:'Fraunces', serif;
  font-size:15px;
  letter-spacing:.14em;
  color:var(--gold);
  margin-bottom:18px;
  font-weight:500;
}

.headline{
  font-family:'Fraunces', serif;
  font-weight:500;
  font-size:clamp(28px, 7vw, 40px);
  line-height:1.15;
  max-width:460px;
  margin-bottom:14px;
}

.sub{
  color:var(--slate);
  font-size:15px;
  line-height:1.6;
  max-width:340px;
  margin-bottom:28px;
}


/* SCREEN 1 */

.cert-stack{
  position:relative;
  width:280px;
  height:190px;
  margin-bottom:36px;
}

.cert{
  position:absolute;

  width:280px;
  height:190px;

  background:var(--parchment);
  border-radius:6px;

  box-shadow:0 20px 40px rgba(0,0,0,.45);

  padding:18px;

  color:var(--ink);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:2px solid var(--gold);
}

.cert::before{
  content:'';
  position:absolute;
  inset:6px;

  border:1px solid var(--gold-soft);

  pointer-events:none;
}

.cert-back{
  transform:rotate(-7deg) translate(-14px, 6px);
  z-index:1;
  opacity:.9;
}

.cert-front{
  transform:rotate(3deg);
  z-index:2;
}

.cert-kicker{
  font-family:'Fraunces', serif;
  font-size:9px;
  letter-spacing:.18em;
  color:var(--gold-soft);
  margin-bottom:4px;
}

.cert-title{
  font-family:'Fraunces', serif;
  font-size:16px;
  font-weight:600;
  letter-spacing:.03em;
  margin-bottom:8px;
}

.cert-name{
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:15px;

  border-bottom:1px solid var(--gold-soft);

  padding-bottom:3px;
  margin-bottom:6px;
}

.cert-course{
  font-size:10px;
  color:var(--slate-soft);
  margin-bottom:10px;
}

.cert-foot{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:8px;
  color:var(--gold-soft);
}

.seal{
  width:16px;
  height:16px;

  border-radius:50%;

  background:var(--maroon);

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--parchment);
  font-size:8px;
}
/* SCREEN 2 */

.feature-list{
  display:flex;
  flex-direction:column;

  gap:20px;

  max-width:340px;
  width:100%;

  text-align:left;

  margin-top:6px;
}

.feature{
  display:flex;
  gap:14px;
  align-items:flex-start;
}

.feature-mark{
  flex-shrink:0;

  width:34px;
  height:34px;

  border-radius:50%;

  border:1px solid var(--gold-soft);

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold);

  font-family:'Fraunces', serif;
  font-size:15px;
}

.feature-title{
  font-family:'Fraunces', serif;
  font-size:16px;
  margin-bottom:3px;
}

.feature-desc{
  font-size:13.5px;
  color:var(--slate);
  line-height:1.5;
}


/* SCREEN 3 */

.why-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

  max-width:360px;
  width:100%;

  margin-top:4px;
}

.why-card{
  border:1px solid rgba(198,161,91,.25);

  border-radius:4px;

  padding:18px 14px;

  text-align:left;
}

.why-title{
  font-family:'Fraunces', serif;

  font-size:15px;

  color:var(--gold);

  margin-bottom:6px;
}

.why-desc{
  font-size:12.5px;

  color:var(--slate);

  line-height:1.5;
}


/* SCREEN 4 */

.btn-group{
  display:flex;
  flex-direction:column;

  gap:12px;

  width:100%;
  max-width:300px;
}

.btn{
  font-family:'Inter', sans-serif;

  font-size:14.5px;
  font-weight:600;

  padding:15px 20px;

  border-radius:3px;

  border:none;

  cursor:pointer;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

.btn:active{
  transform:scale(.98);
}

.btn:hover{
  opacity:.92;
}

.btn-primary{
  background:var(--gold);
  color:var(--ink);
}

.btn-secondary{
  background:transparent;
  color:var(--white);
  border:1px solid rgba(255,255,255,.25);
}


/* NAVIGATION */

.chrome{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:20px 24px 28px;

  display:flex;
  flex-direction:column;
  align-items:center;

  gap:16px;

  background:
    linear-gradient(
      to top,
      var(--ink) 40%,
      transparent
    );

  z-index:10;
}

.dots{
  display:flex;
  gap:7px;
}

.dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:rgba(255,255,255,.2);

  transition:
    background .3s ease,
    width .3s ease;
}

.dot.active{
  background:var(--gold);

  width:18px;

  border-radius:3px;
}

.nav-row{
  display:flex;

  justify-content:space-between;
  align-items:center;

  width:100%;

  max-width:340px;
}

.nav-btn{
  background:none;
  border:none;

  color:var(--slate);

  font-size:13.5px;

  font-family:'Inter', sans-serif;

  cursor:pointer;

  padding:8px;
}

.nav-btn.next{
  color:var(--gold);
  font-weight:600;
}

.nav-btn.hidden{
  visibility:hidden;
}


/* TERMS BUTTON */

.terms-link{
  position:absolute;

  top:20px;
  right:20px;

  font-size:11.5px;

  color:var(--slate-soft);

  text-decoration:underline;

  z-index:20;

  background:none;
  border:none;

  cursor:pointer;

  font-family:'Inter', sans-serif;
}


/* TERMS MODAL */

.modal-overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.6);

  display:none;

  align-items:center;
  justify-content:center;

  z-index:100;

  padding:24px;
}

.modal-overlay.open{
  display:flex;
}

.modal{
  background:var(--parchment);

  color:var(--ink);

  border-radius:6px;

  max-width:420px;
  width:100%;

  max-height:75vh;

  overflow-y:auto;

  padding:26px 22px;

  text-align:left;
}

.modal h3{
  font-family:'Fraunces', serif;

  font-size:19px;

  margin-bottom:14px;
}

.modal ol{
  padding-left:18px;

  font-size:13px;

  line-height:1.7;

  color:#3A3F4B;
}

.modal-close{
  margin-top:18px;

  background:var(--ink);

  color:var(--white);

  border:none;

  padding:11px 18px;

  border-radius:3px;

  font-size:13px;

  cursor:pointer;

  width:100%;
}


/* SMALL PHONES */

@media (max-height:650px){

  .screen{
    padding-top:20px;
    padding-bottom:90px;
  }

  .brand{
    margin-bottom:10px;
  }

  .headline{
    font-size:27px;
    margin-bottom:10px;
  }

  .sub{
    font-size:13px;
    margin-bottom:18px;
  }

  .cert-stack{
    transform:scale(.82);
    margin-bottom:12px;
  }

  .feature-list{
    gap:13px;
  }

  .why-grid{
    gap:10px;
  }

  .why-card{
    padding:13px 11px;
  }

}

</style>
</head>

<body>

<div class="app">
