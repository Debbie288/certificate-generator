<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CertificateHub — Home</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --navy: #0A1220;
            --navy-2: #0F1B2E;
            --card: #121F35;
            --card-elevated: #172742;

            --gold: #C9A24E;
            --gold-soft: #DFC17E;

            --cream: #F5F1E8;

            --gray: #8A93A6;
            --gray-soft: #5E6779;

            --border: rgba(245, 241, 232, 0.09);

            --success: #6FA787;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--navy);
            color: var(--cream);
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }

        .container {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }

        /* Loading screen */

        #loadingScreen {
            position: fixed;
            inset: 0;
            background: var(--navy);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-brand {
            font-family: "Cormorant Garamond", serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--gold-soft);
        }

        /* Header */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(10, 18, 32, 0.97);
            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(12px);
        }

        .header-inner {
            min-height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            border: 1px solid var(--gold);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--gold-soft);

            font-family: "Cormorant Garamond", serif;
            font-size: 24px;
            font-weight: 700;
        }

        .brand-name {
            font-family: "Cormorant Garamond", serif;
            font-size: 25px;
            font-weight: 700;
        }

        .logout-btn {
            border: 1px solid var(--border);
            background: transparent;

            color: var(--gray);

            padding: 9px 14px;
            border-radius: 6px;

            font-size: 12px;
            cursor: pointer;
        }

        .logout-btn:hover {
            color: var(--cream);
            border-color: var(--gold);
        }

    </style>
</head>

<body>

    <!-- Loading -->
    <div id="loadingScreen">
        <div class="loading-brand">
            CertificateHub
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="container header-inner">

            <a
                href="customer-home.html"
                class="brand"
            >
                <div class="brand-mark">
                    C
                </div>

                <div class="brand-name">
                    CertificateHub
                </div>
            </a>

            <button
                class="logout-btn"
                id="logoutBtn"
            >
                Log out
            </button>

        </div>
    </header>
