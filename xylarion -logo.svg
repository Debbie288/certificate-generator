<svg
    width="800"
    height="240"
    viewBox="0 0 800 240"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-labelledby="title desc"
>

    <title id="title">Xylarion</title>

    <desc id="desc">
        Xylarion professional digital credentials logo
    </desc>


    <!-- ========================================= -->
    <!-- ICON BACKGROUND -->
    <!-- ========================================= -->

    <rect
        x="25"
        y="25"
        width="190"
        height="190"
        rx="42"
        fill="#0B1736"
    />


    <!-- ========================================= -->
    <!-- GOLD OUTER RING -->
    <!-- ========================================= -->

    <circle
        cx="120"
        cy="120"
        r="72"
        stroke="#D4AF37"
        stroke-width="6"
        fill="none"
    />


    <!-- ========================================= -->
    <!-- XYLARION "X" SYMBOL -->
    <!-- ========================================= -->

    <path
        d="M78 72
           L105 72
           L120 96
           L135 72
           L162 72
           L134 119
           L162 168
           L135 168
           L120 143
           L105 168
           L78 168
           L106 119
           Z"
        fill="#D4AF37"
    />


    <!-- ========================================= -->
    <!-- VERIFICATION DOT -->
    <!-- ========================================= -->

    <circle
        cx="177"
        cy="63"
        r="10"
        fill="#D4AF37"
    />

    <circle
        cx="177"
        cy="63"
        r="4"
        fill="#0B1736"
    />


    <!-- ========================================= -->
    <!-- BRAND NAME -->
    <!-- ========================================= -->

    <text
        x="250"
        y="125"
        fill="#0B1736"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing="3"
    >
        XYLARION
    </text>


    <!-- ========================================= -->
    <!-- TAGLINE -->
    <!-- ========================================= -->

    <text
        x="254"
        y="166"
        fill="#8A7431"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="6"
    >
        DIGITAL CREDENTIALS
    </text>

</svg>
