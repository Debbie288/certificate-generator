<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | CertificateHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        :root {
            --navy: #0A1220;
            --navy-2: #0F1B2E;
            --card: #121F35;
            --gold: #C9A24E;
            --gold-soft: #DFC17E;
            --cream: #F5F1E8;
            --gray: #8A93A6;
            --border: rgba(245, 241, 232, 0.10);
            --error: #D98B8B;
            --success: #6FA787;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #162640 0%,
                    var(--navy) 48%,
                    #060B13 100%
                );

            color: var(--cream);

            font-family: "Inter", sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .page {
            width: 100%;
            max-width: 470px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-mark {
            width: 58px;
            height: 58px;

            margin: 0 auto 14px;

            border: 1px solid var(--gold);

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--gold-soft);

            font-family: "Cormorant Garamond", serif;
            font-size: 27px;
            font-weight: 700;
        }

        .brand h1 {
            font-family: "Cormorant Garamond", serif;

            font-size: 42px;
            line-height: 1;

            font-weight: 600;

            letter-spacing: 0.3px;
        }

        .brand p {
            margin-top: 8px;

            color: var(--gray);

            font-size: 13px;

            letter-spacing: 0.4px;
        }

        .card {
            background: rgba(18, 31, 53, 0.96);

            border: 1px solid var(--border);

            padding: 34px 28px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35);
        }

        .card-header {
            margin-bottom: 26px;
        }

        .card-header h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: 31px;

            font-weight: 600;

            margin-bottom: 7px;
        }

        .card-header p {
            color: var(--gray);

            font-size: 13px;

            line-height: 1.6;
        }

        .field {
            margin-bottom: 19px;
        }

        label {
            display: block;

            color: var(--cream);

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 8px;

            letter-spacing: 0.2px;
        }

        input {
            width: 100%;

            height: 50px;

            background: #0D182A;

            color: var(--cream);

            border: 1px solid var(--border);

            outline: none;

            padding: 0 14px;

            font-family: "Inter", sans-serif;

            font-size: 14px;

            transition: border-color 0.2s ease;
        }

        input::placeholder {
            color: #596477;
        }

        input:focus {
            border-color: var(--gold);
        }

        button {
            width: 100%;

            height: 52px;

            border: none;

            background: var(--gold);

            color: #101722;

            font-family: "Inter", sans-serif;

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.3px;

            cursor: pointer;

            transition: all 0.2s ease;

            margin-top: 4px;
        }

        button:hover {
            background: var(--gold-soft);
        }

        button:disabled {
            opacity: 0.65;

            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 13px 14px;

            font-size: 12px;

            line-height: 1.5;

            border: 1px solid transparent;
        }

        .message.error {
            display: block;

            color: var(--error);

            background: rgba(217, 139, 139, 0.08);

            border-color: rgba(217, 139, 139, 0.18);
        }

        .message.success {
            display: block;

            color: var(--success);

            background: rgba(111, 167, 135, 0.08);

            border-color: rgba(111, 167, 135, 0.18);
        }

        .signup-link {
            text-align: center;

            margin-top: 22px;

            color: var(--gray);

            font-size: 13px;
        }

        .signup-link a {
            color: var(--gold-soft);

            text-decoration: none;

            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;

            margin-top: 22px;

            color: #596477;

            font-size: 11px;
        }

        @media (max-width: 480px) {

            body {
                padding: 18px;
            }

            .card {
                padding: 28px 21px;
            }

            .brand h1 {
                font-size: 38px;
            }

        }

    </style>
</head>

<body>

<div class="page">

    <!-- BRAND -->

    <div class="brand">

        <div class="brand-mark">
            CH
        </div>

        <h1>
            CertificateHub
        </h1>

        <p>
            Create. Verify. Protect.
        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="card">

        <div class="card-header">

            <h2>
                Welcome back
            </h2>

            <p>
                Log in to manage your certificates
                securely from any device.
            </p>

        </div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    EMAIL ADDRESS
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="loginButton"
            >
                LOG IN
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <div class="signup-link">

            Don't have an account?

            <a href="customer-signup.html">
                Create an account
            </a>

        </div>

    </div>


    <div class="footer">
        © 2026 CertificateHub
    </div>

</div>


<script>

/* ==========================================
   SUPABASE CONFIGURATION
========================================== */

const SUPABASE_URL =
    "https://gdophhworvapqctpmyia.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PUMkwRHzr6lwQQzTQyO1bQ_DCmmQ9ww";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTS
========================================== */

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


/* ==========================================
   MESSAGE FUNCTION
========================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


/* ==========================================
   ROUTE CUSTOMER AFTER LOGIN
========================================== */

async function routeCustomer(user) {

    try {

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select("has_seen_intro")
                .eq("id", user.id)
                .maybeSingle();


        /* Profile query failed */

        if (profileError) {

            console.error(
                "Profile lookup error:",
                profileError
            );

            throw new Error(
                "We couldn't check your account profile. Please try again."
            );

        }


        /*
         * NEW CUSTOMER
         *
         * No profile or introduction has
         * not been completed.
         */

        if (
            !profile ||
            profile.has_seen_intro !== true
        ) {

            window.location.href =
                "customer-onboarding.html";

            return;

        }


        /*
         * RETURNING CUSTOMER
         *
         * Introduction has already been completed.
         */

        window.location.href =
            "customer-home.html";

    } catch (error) {

        console.error(
            "Customer routing error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to open your account. Please try again.",
            "error"
        );

        loginButton.disabled = false;

        loginButton.textContent =
            "LOG IN";

    }

}


/* ==========================================
   LOGIN
========================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        /* Validation */

        if (!email || !password) {

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;

        }


        /* Loading state */

        loginButton.disabled = true;

        loginButton.textContent =
            "LOGGING IN...";

        message.className =
            "message";


        try {

            /* Sign in */

            const {
                data,
                error
            } =
                await supabaseClient.auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (error) {

                console.error(
                    "Login error:",
                    error
                );

                throw error;

            }


            /* Confirm authenticated session */

            if (
                !data ||
                !data.session ||
                !data.user
            ) {

                throw new Error(
                    "Login succeeded, but no authentication session was created."
                );

            }


            /* Success */

            showMessage(
                "Login successful. Opening your account...",
                "success"
            );


            /*
             * Give Supabase a moment to persist
             * the authenticated session before
             * checking the customer's profile.
             */

            setTimeout(
                function() {

                    routeCustomer(
                        data.user
                    );

                },
                500
            );


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            let errorMessage =
                error.message ||
                "Unable to log in.";


            const lowerMessage =
                errorMessage.toLowerCase();


            /* Friendly invalid-login message */

            if (
                lowerMessage.includes(
                    "invalid login credentials"
                )
            ) {

                errorMessage =
                    "The email or password is incorrect.";

            }


            /* Friendly email-confirmation message */

            else if (
                lowerMessage.includes(
                    "email not confirmed"
                )
            ) {

                errorMessage =
                    "Please confirm your email address before logging in.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "LOG IN";

        }

    }
);

</script>

</body>
</html>
