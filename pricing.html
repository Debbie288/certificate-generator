<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#101B2D">

  <meta name="description"
        content="CertificateHub pricing — Create. Verify. Protect.">

  <title>Pricing | CertificateHub</title>

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

  <style>

    :root{
      --ink:#101B2D;
      --ink-2:#16233A;
      --ink-3:#1E2D47;
      --gold:#C6A15B;
      --gold-light:#E3C98D;
      --white:#FFFFFF;
      --muted:#AAB4C4;
      --border:rgba(255,255,255,.09);
      --success:#75D6A3;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(
          circle at top center,
          rgba(198,161,91,.12),
          transparent 34%
        ),
        var(--ink);

      color:var(--white);
      font-family:"DM Sans",sans-serif;
      line-height:1.5;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
    }

    .page{
      width:100%;
      overflow:hidden;
    }

    header{
      width:100%;
      border-bottom:1px solid var(--border);
      background:rgba(16,27,45,.88);
      backdrop-filter:blur(18px);

      position:sticky;
      top:0;
      z-index:100;
    }

    .nav{
      width:min(1180px,92%);
      min-height:76px;
      margin:auto;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-mark{
      width:40px;
      height:40px;

      border:1px solid rgba(198,161,91,.65);
      border-radius:12px;

      display:grid;
      place-items:center;

      color:var(--gold-light);

      background:
        linear-gradient(
          145deg,
          rgba(198,161,91,.16),
          rgba(255,255,255,.03)
        );

      box-shadow:
        0 8px 30px rgba(0,0,0,.18);
    }

    .brand-mark span{
      font-family:"Playfair Display",serif;
      font-size:19px;
      font-weight:700;
    }

    .brand-name{
      font-size:17px;
      font-weight:700;
    }

    .brand-name small{
      display:block;
      color:var(--gold-light);
      font-size:9px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-top:-2px;
    }

    .back-link{
      color:var(--muted);
      font-size:14px;
      font-weight:600;

      padding:10px 14px;
      border-radius:10px;

      transition:.2s ease;
    }

    .back-link:hover{
      color:var(--white);
      background:rgba(255,255,255,.05);
    }

    .hero{
      width:min(900px,92%);
      margin:0 auto;
      text-align:center;

      padding:76px 0 36px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:7px 12px;

      border:1px solid rgba(198,161,91,.28);
      border-radius:999px;

      background:rgba(198,161,91,.07);

      color:var(--gold-light);

      font-size:11px;
      font-weight:700;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .eyebrow-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--gold);
    }

    h1{
      margin-top:22px;

      font-family:"Playfair Display",serif;

      font-size:clamp(38px,7vw,64px);

      line-height:1.05;
      letter-spacing:-1.5px;
    }

    .hero p{
      max-width:650px;
      margin:20px auto 0;

      color:var(--muted);

      font-size:clamp(15px,2.5vw,18px);
    }

    .billing-note{
      width:min(760px,92%);
      margin:0 auto 34px;

      padding:15px 18px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      border:1px solid var(--border);
      border-radius:14px;

      background:rgba(255,255,255,.025);

      color:var(--muted);

      text-align:center;
      font-size:13px;
    }

    .billing-note strong{
      color:var(--gold-light);
    }
    .pricing-section{
      width:min(1180px,92%);
      margin:auto;
      padding-bottom:70px;
    }

    .pricing-grid{
      display:grid;
      grid-template-columns:
        repeat(4,minmax(0,1fr));
      gap:18px;
      align-items:stretch;
    }

    .plan{
      position:relative;

      display:flex;
      flex-direction:column;

      padding:28px 24px 24px;

      border:1px solid var(--border);
      border-radius:20px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.045),
          rgba(255,255,255,.018)
        );

      box-shadow:
        0 20px 50px rgba(0,0,0,.18);

      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
    }

    .plan:hover{
      transform:translateY(-5px);

      border-color:
        rgba(198,161,91,.35);

      box-shadow:
        0 25px 65px rgba(0,0,0,.25);
    }

    .plan.featured{
      border-color:
        rgba(198,161,91,.72);

      background:
        linear-gradient(
          145deg,
          rgba(198,161,91,.12),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 25px 70px rgba(0,0,0,.28),
        0 0 0 1px rgba(198,161,91,.08);
    }

    .popular{
      position:absolute;

      top:16px;
      right:16px;

      padding:6px 9px;

      border-radius:999px;

      background:var(--gold);
      color:var(--ink);

      font-size:9px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    .plan-name{
      font-size:20px;
      font-weight:700;
    }

    .plan-description{
      min-height:48px;
      margin-top:7px;

      color:var(--muted);
      font-size:13px;
    }

    .price{
      margin-top:22px;
    }

    .price-amount{
      font-size:34px;
      line-height:1;
      font-weight:700;
      letter-spacing:-1px;
    }

    .price-period{
      margin-left:5px;
      color:var(--muted);
      font-size:12px;
    }

    .price.free .price-amount{
      font-size:38px;
    }

    .plan-button{
      width:100%;

      margin-top:24px;

      padding:13px 15px;

      border-radius:11px;

      border:1px solid
        rgba(198,161,91,.55);

      background:transparent;

      color:var(--gold-light);

      font-weight:700;

      cursor:pointer;

      transition:.2s ease;
    }

    .plan-button:hover{
      background:rgba(198,161,91,.10);
      border-color:var(--gold);
    }

    .plan.featured .plan-button{
      background:var(--gold);
      border-color:var(--gold);
      color:var(--ink);
    }

    .plan.featured .plan-button:hover{
      background:var(--gold-light);
    }

    .plan-button:active{
      transform:scale(.98);
    }

    .plan-button.current{
      border-color:
        rgba(117,214,163,.35);

      color:var(--success);

      background:
        rgba(117,214,163,.06);

      cursor:default;
    }

    .divider{
      height:1px;
      margin:25px 0 20px;
      background:var(--border);
    }

    .includes{
      color:var(--white);
      font-size:12px;
      font-weight:700;
      margin-bottom:13px;
    }

    .features{
      list-style:none;
      display:grid;
      gap:11px;
    }

    .features li{
      display:flex;
      align-items:flex-start;
      gap:9px;

      color:var(--muted);
      font-size:12.5px;
    }

    .check{
      flex:none;

      width:17px;
      height:17px;

      display:grid;
      place-items:center;

      border-radius:50%;

      background:
        rgba(198,161,91,.12);

      color:var(--gold-light);

      font-size:10px;
      font-weight:800;
    }
    .trust{
      width:min(900px,92%);
      margin:0 auto;

      padding:28px;

      border:1px solid var(--border);
      border-radius:18px;

      background:rgba(255,255,255,.025);

      text-align:center;
    }

    .trust h2{
      font-family:"Playfair Display",serif;
      font-size:25px;
    }

    .trust p{
      max-width:650px;
      margin:10px auto 0;

      color:var(--muted);
      font-size:13px;
    }

    .trust-items{
      margin-top:22px;

      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
    }

    .trust-item{
      padding:9px 13px;

      border:1px solid var(--border);
      border-radius:999px;

      color:#C8D0DC;
      background:rgba(255,255,255,.025);

      font-size:11px;
      font-weight:600;
    }

    .faq{
      width:min(900px,92%);
      margin:55px auto 0;
      padding-bottom:70px;
    }

    .faq-title{
      text-align:center;

      font-family:"Playfair Display",serif;

      font-size:30px;
      margin-bottom:22px;
    }

    details{
      border-bottom:1px solid var(--border);
    }

    details:first-of-type{
      border-top:1px solid var(--border);
    }

    summary{
      list-style:none;
      cursor:pointer;

      padding:19px 5px;

      display:flex;
      justify-content:space-between;
      gap:20px;

      color:var(--white);

      font-size:14px;
      font-weight:700;
    }

    summary::-webkit-details-marker{
      display:none;
    }

    summary::after{
      content:"+";

      color:var(--gold-light);

      font-size:20px;
      font-weight:400;
    }

    details[open] summary::after{
      content:"−";
    }

    details p{
      padding:0 5px 19px;

      color:var(--muted);

      font-size:13px;
      line-height:1.7;
    }

    footer{
      border-top:1px solid var(--border);

      padding:30px 20px 40px;

      text-align:center;

      color:var(--muted);

      font-size:11px;
    }

    footer strong{
      color:var(--gold-light);
    }
