<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#101B2D">

  <meta name="description"
        content="CertificateHub pricing — Create. Verify. Protect.">

  <title>Pricing | CertificateHub</title>

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

  <style>

    :root{
      --ink:#101B2D;
      --ink-2:#16233A;
      --ink-3:#1E2D47;
      --gold:#C6A15B;
      --gold-light:#E3C98D;
      --white:#FFFFFF;
      --muted:#AAB4C4;
      --border:rgba(255,255,255,.09);
      --success:#75D6A3;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:100vh;
      background:
        radial-gradient(
          circle at top center,
          rgba(198,161,91,.12),
          transparent 34%
        ),
        var(--ink);

      color:var(--white);
      font-family:"DM Sans",sans-serif;
      line-height:1.5;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font:inherit;
    }

    .page{
      width:100%;
      overflow:hidden;
    }

    header{
      width:100%;
      border-bottom:1px solid var(--border);
      background:rgba(16,27,45,.88);
      backdrop-filter:blur(18px);

      position:sticky;
      top:0;
      z-index:100;
    }

    .nav{
      width:min(1180px,92%);
      min-height:76px;
      margin:auto;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .brand-mark{
      width:40px;
      height:40px;

      border:1px solid rgba(198,161,91,.65);
      border-radius:12px;

      display:grid;
      place-items:center;

      color:var(--gold-light);

      background:
        linear-gradient(
          145deg,
          rgba(198,161,91,.16),
          rgba(255,255,255,.03)
        );

      box-shadow:
        0 8px 30px rgba(0,0,0,.18);
    }

    .brand-mark span{
      font-family:"Playfair Display",serif;
      font-size:19px;
      font-weight:700;
    }

    .brand-name{
      font-size:17px;
      font-weight:700;
    }

    .brand-name small{
      display:block;
      color:var(--gold-light);
      font-size:9px;
      letter-spacing:2px;
      text-transform:uppercase;
      margin-top:-2px;
    }

    .back-link{
      color:var(--muted);
      font-size:14px;
      font-weight:600;

      padding:10px 14px;
      border-radius:10px;

      transition:.2s ease;
    }

    .back-link:hover{
      color:var(--white);
      background:rgba(255,255,255,.05);
    }

    .hero{
      width:min(900px,92%);
      margin:0 auto;
      text-align:center;

      padding:76px 0 36px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:7px 12px;

      border:1px solid rgba(198,161,91,.28);
      border-radius:999px;

      background:rgba(198,161,91,.07);

      color:var(--gold-light);

      font-size:11px;
      font-weight:700;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .eyebrow-dot{
      width:6px;
      height:6px;
      border-radius:50%;
      background:var(--gold);
    }

    h1{
      margin-top:22px;

      font-family:"Playfair Display",serif;

      font-size:clamp(38px,7vw,64px);

      line-height:1.05;
      letter-spacing:-1.5px;
    }

    .hero p{
      max-width:650px;
      margin:20px auto 0;

      color:var(--muted);

      font-size:clamp(15px,2.5vw,18px);
    }

    .billing-note{
      width:min(760px,92%);
      margin:0 auto 34px;

      padding:15px 18px;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      border:1px solid var(--border);
      border-radius:14px;

      background:rgba(255,255,255,.025);

      color:var(--muted);

      text-align:center;
      font-size:13px;
    }

    .billing-note strong{
      color:var(--gold-light);
    }
