<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Certificate Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📜 Premium Certificate Generator</h1>
    <p>Create professional certificates with your logo and branding.</p>

    <form id="certificateForm">
      <!-- Institution Name -->
      <div class="form-group">
        <label for="institutionName">Institution / Organization *</label>
        <input type="text" id="institutionName" placeholder="e.g. ABC Training Center" required />
      </div>

      <!-- Logo Upload -->
      <div class="form-group">
        <label for="logoUpload">Upload Logo (optional)</label>
        <input type="file" id="logoUpload" accept="image/*" />
        <small>Upload your organization logo (PNG, JPG, or SVG)</small>
      </div>

      <!-- Student Name -->
      <div class="form-group">
        <label for="studentName">Student Name *</label>
        <input type="text" id="studentName" placeholder="e.g. John Doe" required />
      </div>

      <!-- Course Name -->
      <div class="form-group">
        <label for="courseName">Course / Program *</label>
        <input type="text" id="courseName" placeholder="e.g. Web Development Bootcamp" required />
      </div>

      <!-- Completion Date -->
      <div class="form-group">
        <label for="completionDate">Completion Date *</label>
        <input type="date" id="completionDate" required />
      </div>

      <!-- Certificate Number -->
      <div class="form-group">
        <label for="certNumber">Certificate Number (optional)</label>
        <input type="text" id="certNumber" placeholder="e.g. 2026-001" />
        <small>Leave blank for auto-generation</small>
      </div>

      <!-- Director Name -->
      <div class="form-group">
        <label for="directorName">Director / Signatory Name *</label>
        <input type="text" id="directorName" placeholder="e.g. Dr. Jane Anderson" required />
      </div>

      <!-- NEW: Certificate Template Selector -->
      <div class="form-group">
        <label for="templateSelect">Certificate Template</label>
        <select id="templateSelect">
          <option value="classic">🎓 Classic</option>
          <option value="modern">✨ Modern</option>
          <option value="gold">👑 Gold</option>
          <option value="elegant">🌸 Elegant</option>
        </select>
      </div>

      <button type="submit" id="generateBtn">🎓 Generate Certificate</button>
    </form>

    <!-- Certificate Preview Area -->
    <div id="previewArea" style="margin-top: 2rem; display: none;">
      <h2>📄 Certificate Preview</h2>
      <div id="certificatePreview"></div>
    </div>

    <!-- NEW: "Powered by" Footer -->
    <footer style="text-align: center; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
      <p style="font-size: 0.8rem; color: #94a3b8;">
        Powered by <a href="https://debbie288.github.io/certificate-generator/" 
                      style="color: #2563eb; text-decoration: none; font-weight: 600;">
          Certificate Generator
        </a>
      </p>
    </footer>
  </div>


<script src="script.js"></script>
</body>
</html>
</body>
        </html>
